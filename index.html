<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szirtes út 26/B — Apartment for sale by the Citadel, Budapest</title>
<meta name="description" content="Bright 83 m² second-floor apartment in a gated courtyard on Gellért Hill, overlooking the Citadel promenade and nature reserve, Budapest.">
<meta property="og:title" content="Szirtes út 26/B — Apartment for sale by the Citadel">
<meta property="og:description" content="83 m², 2 bedrooms, gated courtyard with mature trees, a short walk from the Citadel.">
<meta property="og:image" content="/img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='14' fill='%23d99a2b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="/config.js"></script>
</head>
<body>

<header class="nav">
  <a class="brand" href="#top">Szirtes út <span>26/B</span></a>
  <nav class="links">
    <a href="#location" data-i18n="nav.location"></a>
    <a href="#gallery" data-i18n="nav.gallery"></a>
    <a href="#details" data-i18n="nav.details"></a>
    <a href="#sun" data-i18n="nav.sun"></a>
    <a href="#map" data-i18n="nav.map"></a>
    <a href="#contact" class="btn-small" data-i18n="nav.contact"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="hu">HU</button>
  </div>
</header>

<main id="top">

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <p class="eyebrow" data-i18n="hero.eyebrow"></p>
    <h1 data-i18n="hero.title"></h1>
    <p class="lead" data-i18n="hero.lead"></p>
    <ul class="facts">
      <li><strong>83 m²</strong><span data-i18n="fact.area"></span></li>
      <li><strong>2</strong><span data-i18n="fact.bedrooms"></span></li>
      <li><strong data-i18n="fact.bathsVal"></strong><span data-i18n="fact.baths"></span></li>
      <li><strong data-i18n="fact.floorVal"></strong><span data-i18n="fact.floor"></span></li>
    </ul>
    <div class="price-row">
      <div>
        <div class="price" id="price"></div>
      </div>
      <a href="#contact" class="btn" data-i18n="hero.cta"></a>
    </div>
  </div>
  <figure class="hero-img">
    <img src="/img/hero-frontage.webp" srcset="/img/hero-frontage-sm.webp 700w, /img/hero-frontage.webp 1350w" sizes="(max-width: 900px) 100vw, 45vw" alt="" data-i18n-alt="alt.hero" fetchpriority="high">
    <figcaption data-i18n="hero.caption"></figcaption>
  </figure>
</section>

<!-- LOCATION HIGHLIGHT -->
<section id="location" class="location">
  <div class="loc-head">
    <div class="big-stat"><span class="num">&lt;5</span><span class="unit" data-i18n="loc.minutes"></span></div>
    <div>
      <p class="eyebrow light" data-i18n="loc.eyebrow"></p>
      <h2 data-i18n="loc.title"></h2>
      <p data-i18n="loc.text"></p>
    </div>
  </div>
  <figure class="aerial">
    <img src="/img/aerial.webp" srcset="/img/aerial-sm.webp 900w, /img/aerial.webp 2400w" sizes="100vw" alt="" data-i18n-alt="alt.aerial" loading="lazy">
    <figcaption data-i18n="loc.aerialCaption"></figcaption>
  </figure>
  <div class="loc-pair">
    <figure>
      <img src="/img/citadel-lookout-sm.webp" srcset="/img/citadel-lookout-sm.webp 900w, /img/citadel-lookout.webp 2400w" sizes="(max-width: 700px) 100vw, 640px" alt="" data-i18n-alt="cit.lookCap" loading="lazy">
      <figcaption data-i18n="cit.lookCap"></figcaption>
    </figure>
    <figure>
      <img src="/img/citadella-park-2-sm.webp" srcset="/img/citadella-park-2-sm.webp 800w, /img/citadella-park-2.webp 1800w" sizes="(max-width: 700px) 100vw, 640px" alt="" data-i18n-alt="g.citPark2" loading="lazy">
      <figcaption data-i18n="g.citPark2"></figcaption>
    </figure>
  </div>
  <ul class="loc-points">
    <li><h3 data-i18n="loc.p2t"></h3><p data-i18n="loc.p2"></p></li>
    <li><h3 data-i18n="loc.p3t"></h3><p data-i18n="loc.p3"></p></li>
    <li><h3 data-i18n="loc.p4t"></h3><p data-i18n="loc.p4"></p></li>
  </ul>
</section>

<!-- GALLERY -->
<section id="gallery" class="section">
  <h2 data-i18n="gallery.title"></h2>
  <div class="gallery" id="galleryGrid"></div>
</section>

<!-- DETAILS -->
<section id="details" class="section details">
  <div class="desc">
    <h2 data-i18n="details.title"></h2>
    <p data-i18n="desc.p1"></p>
    <p data-i18n="desc.p2"></p>
    <p data-i18n="desc.p3"></p>
    <p data-i18n="desc.p4"></p>
    <p data-i18n="desc.p5"></p>
    <h3 data-i18n="desc.extrasTitle"></h3>
    <ul class="ticks">
      <li data-i18n="desc.x1"></li>
      <li data-i18n="desc.x2"></li>
      <li data-i18n="desc.x3"></li>
      <li data-i18n="desc.xEv"></li>
    </ul>
    <p class="desc-strong" data-i18n="desc.p6"></p>
  </div>
  <aside class="spec">
    <h3 data-i18n="spec.title"></h3>
    <dl>
      <dt data-i18n="spec.price"></dt><dd id="specPrice"></dd>
      <dt data-i18n="spec.area"></dt><dd>83 m²</dd>
      <dt data-i18n="spec.rooms"></dt><dd data-i18n="spec.roomsVal"></dd>
      <dt data-i18n="spec.baths"></dt><dd data-i18n="spec.bathsVal"></dd>
      <dt data-i18n="spec.floor"></dt><dd data-i18n="spec.floorVal"></dd>
      <dt data-i18n="spec.terrace"></dt><dd data-i18n="spec.terraceVal"></dd>
      <dt data-i18n="spec.light"></dt><dd data-i18n="spec.lightVal"></dd>
      <dt data-i18n="spec.floors"></dt><dd data-i18n="spec.floorsVal"></dd>
      <dt data-i18n="spec.heating"></dt><dd data-i18n="spec.heatingVal"></dd>
      <dt data-i18n="spec.water"></dt><dd data-i18n="spec.waterVal"></dd>
      <dt data-i18n="spec.parking"></dt><dd data-i18n="spec.parkingVal"></dd>
      <dt data-i18n="spec.ev"></dt><dd data-i18n="spec.evVal"></dd>
      <dt data-i18n="spec.storage"></dt><dd data-i18n="spec.storageVal"></dd>
      <dt data-i18n="spec.address"></dt><dd>Szirtes út 26/B<br>1016 Budapest</dd>
    </dl>
    <a href="#contact" class="btn full" data-i18n="hero.cta"></a>
  </aside>
</section>

<!-- SUN -->
<section id="sun" class="sun">
  <div class="sun-text">
    <p class="eyebrow light" data-i18n="sun.eyebrow"></p>
    <h2 data-i18n="sun.title"></h2>
    <p data-i18n="sun.p3"></p>
    <p data-i18n="sun.p1"></p>
    <p data-i18n="sun.p2"></p>
  </div>
  <div class="sun-panel">
    <div class="sun-map" id="sun3d">
      <div id="sun3dMap"></div>
      <div class="sun-loading" id="sunLoading" data-i18n="sun3d.loading"></div>
      <div class="sun3d-night" id="sun3dNight" hidden data-i18n="sun.below"></div>
    </div>
    <div class="sun-ctl">
      <div class="chips" id="seasonBtns">
        <button data-day="today" data-i18n="sun.today"></button>
        <button data-day="spring" data-i18n="sun.spring"></button>
        <button data-day="summer" data-i18n="sun.summer"></button>
        <button data-day="autumn" data-i18n="sun.autumn"></button>
        <button data-day="winter" data-i18n="sun.winter"></button>
      </div>
      <div class="sun-time">
        <button class="sun-playbtn" id="sunPlay" type="button" aria-label="Play"><svg viewBox="0 0 24 24" width="16" height="16"><path id="sunPlayIcon" d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
        <svg class="sun-ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 4v4M9.5 6.5 12 4l2.5 2.5M4.2 11.2l1.6 1M19.8 11.2l-1.6 1" fill="none" stroke="#d99a2b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="range" id="timeSlider" min="420" max="960" step="1" aria-label="Time of day">
        <svg class="sun-ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 8V4M9.5 5.5 12 8l2.5-2.5M4.2 11.2l1.6 1M19.8 11.2l-1.6 1" fill="none" stroke="#c8553d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <output id="timeOut" class="sun-clock"></output>
      </div>
      <p class="sun-status" id="sunStatus"></p>
      <p class="sun-note" data-i18n="sun3d.note"></p>
    </div>
  </div>
</section>

<!-- CITADELLA -->
<section id="citadella" class="citadella">
  <div class="cit-inner">
    <p class="eyebrow light" data-i18n="cit.eyebrow"></p>
    <h2 data-i18n="cit.title"></h2>
    <p class="cit-walk"><span class="cit-badge">&lt;5 min</span><span data-i18n="cit.walk"></span></p>
    <figure class="cit-map">
      <img src="/img/walk-map.webp" srcset="/img/walk-map-sm.webp 900w, /img/walk-map.webp 2400w" sizes="(max-width: 900px) 100vw, 1300px" alt="" data-i18n-alt="cit.mapCap" loading="lazy">
      <figcaption data-i18n="cit.mapCap"></figcaption>
    </figure>
    <div class="cit-grid">
      <div class="cit-text">
        <h3 data-i18n="cit.p1t"></h3><p data-i18n="cit.p1"></p>
        <h3 data-i18n="cit.p2t"></h3><p data-i18n="cit.p2"></p>
        <h3 data-i18n="cit.p3t"></h3><p data-i18n="cit.p3"></p>
      </div>
      <figure class="cit-photo">
        <img src="/img/citadella-park-1.webp" srcset="/img/citadella-park-1-sm.webp 800w, /img/citadella-park-1.webp 1800w" sizes="(max-width: 900px) 100vw, 640px" alt="" data-i18n-alt="g.citPark1" loading="lazy">
        <figcaption data-i18n="g.citPark1"></figcaption>
      </figure>
    </div>
  </div>
</section>

<!-- FIREWORKS -->
<section id="fireworks" class="fireworks">
  <div class="fw-stack" id="fwStack"></div>
  <div class="fw-text">
    <h3 data-i18n="fw.title"></h3>
    <p data-i18n="fw.hint"></p>
  </div>
</section>

<!-- MAP + NEARBY -->
<section id="map" class="section">
  <h2 data-i18n="map.title"></h2>
  <div class="map-wrap"><div id="mapCanvas"></div></div>
  <div class="map-below">
    <p class="map-links"><a id="gmapsLink" target="_blank" rel="noopener" data-i18n="map.open"></a> · <a id="citadellaWalk" target="_blank" rel="noopener" data-i18n="map.walk"></a></p>
    <button class="sv-thumb" id="svThumb" type="button" hidden>
      <img id="svImg" alt="">
      <span data-i18n="sv.label"></span>
    </button>
  </div>

  <div class="nearby">
    <div>
      <h3 data-i18n="near.transport"></h3>
      <ul>
        <li data-i18n="near.t1"></li>
        <li data-i18n="near.t2"></li>
        <li data-i18n="near.t3"></li>
        <li data-i18n="near.t4"></li>
        <li data-i18n="near.t5"></li>
      </ul>
    </div>
    <div>
      <h3 data-i18n="near.schools"></h3>
      <ul class="school-list" id="schoolList"></ul>
      <p class="school-note" data-i18n="school.note"></p>
    </div>
    <div>
      <h3 data-i18n="near.leisure"></h3>
      <ul>
        <li data-i18n="near.l1"></li>
        <li data-i18n="near.l2"></li>
        <li data-i18n="near.l3"></li>
        <li data-i18n="near.l4"></li>
        <li data-i18n="near.l6"></li>
        <li data-i18n="near.l5"></li>
      </ul>
    </div>
  </div>
</section>

<!-- AIR QUALITY -->
<section id="air" class="section air" hidden>
  <div class="elev-badge" id="elevBadge" hidden></div>
  <p class="eyebrow" data-i18n="air.eyebrow"></p>
  <h2 data-i18n="air.title"></h2>
  <div class="aq-cards">
    <article class="aq-card home" id="aqHome">
      <span class="aq-tag" data-i18n="air.homeTag"></span>
      <h3 data-i18n="air.homeName"></h3>
      <div class="aq-num"><span class="v"></span><span class="of">/100</span></div>
      <div class="aq-cat"></div>
      <div class="aq-pol"></div>
    </article>
    <article class="aq-card" id="aqCity">
      <span class="aq-tag muted" data-i18n="air.cityTag"></span>
      <h3 class="aq-place"></h3>
      <div class="aq-num"><span class="v"></span><span class="of">/100</span></div>
      <div class="aq-cat"></div>
      <div class="aq-pol"></div>
    </article>
  </div>
  <p class="aq-caption" id="aqCaption"></p>
  <p class="aq-foot" id="aqFoot"></p>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
  <div>
    <p class="eyebrow light" data-i18n="contact.eyebrow"></p>
    <h2 data-i18n="contact.title"></h2>
    <p data-i18n="contact.text"></p>
    <div class="contact-direct">
      <div class="c-name" id="cName"></div>
      <a id="cPhone" class="c-line"></a>
      <a id="cEmail" class="c-line"></a>
    </div>
  </div>
  <form id="contactForm" class="form">
    <label><span data-i18n="form.name"></span><input name="name" required autocomplete="name"></label>
    <label><span data-i18n="form.email"></span><input name="email" type="email" required autocomplete="email"></label>
    <label><span data-i18n="form.phone"></span><input name="phone" type="tel" autocomplete="tel"></label>
    <label><span data-i18n="form.message"></span><textarea name="message" rows="4" data-i18n-placeholder="form.placeholder"></textarea></label>
    <button class="btn" type="submit" data-i18n="form.send"></button>
    <p class="form-note" data-i18n="form.note"></p>
  </form>
</section>

</main>

<footer class="footer">
  <p>Szirtes út 26/B · 1016 Budapest</p>
  <p class="small" data-i18n="footer.disclaimer"></p>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" aria-label="Close">×</button>
  <button class="lb-prev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-next" aria-label="Next">›</button>
  <p id="lbCap"></p>
</div>

<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<script src="/app.js"></script>
</body>
</html>
